name: Answer a challenge

# Writes the worked answer for a day that has a question and no answer, and
# opens it as a pull request.
#
# Two uses:
#   - backfilling days generated before answers were part of the daily run
#   - replacing an answer that came back wrong, which it overwrites rather
#     than appending a second one below the first
#
# Takes one date or several. Several land in a single PR, because reviewing a
# batch of backfill in one place beats five near-identical PRs.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "YYYY-MM-DD, or several separated by spaces"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: answer-challenge
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the answers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DATES_INPUT: ${{ inputs.dates }}
        run: |
          for date in $DATES_INPUT; do
            python scripts/generate_challenge.py --answer --date "$date"
          done

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATES_INPUT: ${{ inputs.dates }}
        run: |
          if git diff --quiet -- challenges/; then
            echo "no change — those days already have their answers"
            exit 0
          fi

          # Distinct per run, so a re-run does not collide with a branch whose
          # PR is still open.
          BRANCH="answers/$(date +%Y%m%d-%H%M%S)"
          COUNT=$(echo $DATES_INPUT | wc -w | tr -d ' ')

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add challenges/
          git commit -m "Add worked answers for $DATES_INPUT"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Worked answers for $COUNT earlier challenge(s)" \
            --body "$(cat <<EOF
          Fills in the answer for: \`$DATES_INPUT\`

          These days were generated before the answer was part of the daily run,
          so they had a question and nothing under it.

          **Before merging:** skim each answer. It is generated, so check it
          addresses every deliverable and that the code in it is right.
          EOF
          )" \
            --head "$BRANCH" \
            --base main \
            --label "challenge"
