name: Daily challenge

# Generates one backend challenge each morning, answers it, and commits both
# straight to main.
#
# Two API calls, not one: the question is written first, then handed to a second
# call that has to solve it. Asking for both at once produces a question shaped
# around a convenient answer, which is the wrong way round — the question should
# come from the scenario, and the answer should have to deal with it.
#
# No pull request. Nothing gates the answer any more, so nobody reviews it
# before it is public — and it is generated, so it is occasionally confidently
# wrong. Read the day's file when you sit down to it, and fix what is wrong.

on:
  schedule:
    # 03:30 UTC = 09:00 IST. GitHub's scheduler is best-effort and can lag
    # under load, so treat this as "some time in the morning", not 09:00 sharp.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Override the weekday topic (optional)"
        required: false
      date:
        description: "YYYY-MM-DD (optional, defaults to today IST)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-challenge
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheap check first. A re-run should not spend Gemini quota only to
      # discover further down that today's challenge is already committed.
      - name: Skip if today is already on main
        id: guard
        env:
          # Honour the manual override, else today in IST — matching how the
          # generator itself resolves the date.
          DATE_INPUT: ${{ inputs.date }}
        run: |
          DATE="${DATE_INPUT:-$(TZ=Asia/Kolkata date +%F)}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          if [ -f "challenges/$DATE.md" ]; then
            echo "challenges/$DATE.md already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate today's challenge and answer
        if: steps.guard.outputs.skip == 'false'
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Through the environment, not ${{ }} interpolation: expanding a
          # dispatch input straight into the script would let the topic field
          # run shell.
          TOPIC_INPUT: ${{ inputs.topic }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          args=()
          if [ -n "$TOPIC_INPUT" ]; then args+=(--topic "$TOPIC_INPUT"); fi
          if [ -n "$DATE_INPUT" ]; then args+=(--date "$DATE_INPUT"); fi

          python scripts/generate_challenge.py "${args[@]}"

      - name: Commit it to main
        if: steps.guard.outputs.skip == 'false' && steps.generate.outputs.date != ''
        env:
          DATE: ${{ steps.generate.outputs.date }}
          TOPIC: ${{ steps.generate.outputs.topic }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first, then ask the index. A new challenge file is untracked,
          # and `git diff` does not see untracked files — checking the worktree
          # here reported "nothing changed" and silently dropped the challenge.
          git add challenges/

          if git diff --cached --quiet -- challenges/; then
            echo "nothing staged — not committing"
            exit 0
          fi

          git commit -m "Add challenge for $DATE ($TOPIC)"

          # main may have moved while the two API calls were running. Rebase
          # rather than force: this job is never the only thing pushing here.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
